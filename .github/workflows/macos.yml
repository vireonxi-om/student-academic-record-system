name: macOS build and tests
on:
  push:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native executables and test C program
        run: make -B CC=clang test gui
      - name: Test browser backend
        run: make CC=clang gui-test
      - name: Check launchers
        run: sh -n Start-Mac.command Start-Console-Mac.command gui/start.sh
